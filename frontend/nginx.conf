# Страницы SPA и API на одном адресе: cookie сессии работает без CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Файлы сборки с хешем в имени кешируем надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Прямые ссылки вида /professions/qa-manual отдают index.html, дальше маршрут решает React.
  location / {
    try_files $uri /index.html;
  }
}
