# ЧЕРНОВИК. Профессии со статусом «Скоро»: в каталоге видны, но карточка не открывается.
# Контента (блоки, темы, навыки) пока нет. Когда профессию наполняем — переносим её в отдельный
# файл seed/<slug>.yaml по образцу qa-manual.yaml и удаляем отсюда (slug не меняем).
# Список черновой: Рустам может заменить профессии по данным о junior-вакансиях.
professions:
  - slug: frontend-developer
    title: Frontend-разработчик
    description: "Делает то, что пользователь видит в браузере: страницы, формы, интерфейсы на JavaScript, TypeScript и React."
    for_whom: Тем, кому нравится сразу видеть результат своей работы на экране.
    sort_order: 4
  - slug: data-analyst
    title: Аналитик данных
    description: "Собирает и разбирает данные, строит отчёты и дашборды, помогает бизнесу принимать решения. SQL, Excel, Python, BI-системы."
    for_whom: Тем, кто любит цифры, таблицы и искать закономерности.
    sort_order: 5
  - slug: system-analyst
    title: Системный аналитик
    description: "Переводит задачи бизнеса на язык разработчиков: собирает требования, пишет ТЗ, описывает API и схемы данных."
    for_whom: Тем, кто хочет в IT, но больше любит разбираться и объяснять, чем писать код.
    sort_order: 6
  - slug: qa-automation
    title: Тестировщик-автоматизатор (QA Automation)
    description: "Пишет автотесты, которые проверяют приложение вместо человека: UI, API, нагрузка. Python или Java, Selenium, Playwright, pytest."
    for_whom: Тем, кто уже знаком с ручным тестированием и хочет писать код.
    sort_order: 7
  - slug: 1c-developer
    title: Программист 1С
    description: "Настраивает и дорабатывает программы 1С для учёта, склада, зарплаты и продаж — одна из самых востребованных профессий у бизнеса."
    for_whom: Тем, кто хочет быстро найти первую работу и не боится бухгалтерии и бизнес-процессов.
    sort_order: 8
  - slug: csharp-developer
    title: C#/.NET-разработчик
    description: "Пишет серверную часть, корпоративные системы и десктоп-приложения на C# и .NET."
    for_whom: Тем, кто хочет строгий современный язык и работу в крупных компаниях.
    sort_order: 9
  - slug: android-developer
    title: Android-разработчик
    description: "Создаёт мобильные приложения для Android на Kotlin."
    for_whom: Тем, кто хочет делать приложения для телефона.
    sort_order: 10
  - slug: devops-engineer
    title: DevOps-инженер
    description: "Настраивает серверы, сборку и выкладку приложений: Linux, Docker, CI/CD, мониторинг."
    for_whom: Тем, кому интереснее, как всё работает «под капотом», чем интерфейсы.
    sort_order: 11
  - slug: go-developer
    title: Go-разработчик
    description: "Пишет быстрые серверные сервисы на Go: API, микросервисы, высоконагруженные системы."
    for_whom: Тем, кто хочет в бэкенд и уже знаком с основами программирования.
    sort_order: 12
  - slug: support-engineer
    title: Инженер технической поддержки
    description: "Помогает пользователям и компаниям решать проблемы с программами, сетью и сервисами; разбирается в логах, базах данных и HTTP."
    for_whom: Тем, кто хочет войти в IT быстрее всего и вырасти дальше в тестирование, аналитику или DevOps.
    sort_order: 13
