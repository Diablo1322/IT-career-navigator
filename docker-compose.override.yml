# Только для рабочего репозитория: простой фронтенд для проверки API (React SPA) — http://localhost:3000.
# Docker Compose подхватывает этот файл сам вместе с docker-compose.yml.
# В общий репозиторий не выгружается: там frontend/ ведёт Евгений.
services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
